<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 id="title">Pesquisa de Satisfação</h1>
        <p id="description">Conte-nos um pouco sobre sua experiência</p>
    </header>

    <main>
        <form id="survey-form">
            <div class="form-group">
                <label id="name-label" for="name">Nome</label>
                <input id="name" type="text" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label id="email-label" for="email">E-mail</label>
                <input id="email" type="email" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="form-group">
                <label id="number-label" for="number">Idade</label>
                <input id="number" type="number" min="0" max="110" placeholder="Ex: 25">
            </div>

            <div class="form-group">
                <label for="dropdown">Como você nos conheceu?</label>
                <select id="dropdown">
                    <option disabled selected value="">Selecione uma opção</option>
                    <option value="web">Pesquisa Web</option>
                    <option value="friends">Amigos</option>
                    <option value="other">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <p>Você recomendaria nosso serviço?</p>
                <label class="inline-label">
                    <input name="recommend" value="yes" type="radio" checked> Com certeza
                </label>
                <label class="inline-label">
                    <input name="recommend" value="maybe" type="radio"> Talvez
                </label>
            </div>

            <div class="form-group">
                <p>O que você mais gosta? (Selecione todos que se aplicam)</p>
                <label class="inline-label">
                    <input type="checkbox" value="design"> Design
                </label>
                <label class="inline-label">
                    <input type="checkbox" value="speed"> Velocidade
                </label>
                <label class="inline-label">
                    <input type="checkbox" value="support"> Suporte
                </label>
            </div>

            <div class="form-group">
                <label for="comments">Sugestões adicionais:</label>
                <textarea id="comments" name="comments" placeholder="Escreva aqui..."></textarea>
            </div>

            <button id="submit" type="submit">Enviar Formulário</button>
        </form>
    </main>
</body>
</html>
